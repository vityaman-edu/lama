<?xml version="1.0"?>
<def format="2">
  <!-- Resolve real framework headers, but model their unsupported implementations.
       The builtin googletest profile models assertions; property and domain
       callbacks remain visible in FuzzTest registration expressions. -->
  <define name="GOOGLETEST_INCLUDE_GTEST_GTEST_H_" value="1"/>
  <define name="FUZZTEST_FUZZTEST_FUZZTEST_H_" value="1"/>
  <define name="FUZZ_TEST(suite,property)" value="auto cppcheck_registration_##suite##_##property = cppcheck_register_property(property)"/>
</def>
