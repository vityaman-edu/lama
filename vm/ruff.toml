target-version = "py310"
line-length = 100

[lint]
select = [
  "A", "ANN", "ARG", "ASYNC", "B", "C4", "DTZ", "E", "F", "FBT", "FLY",
  "G", "I", "ICN", "INT", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PLC", "PLE",
  "PLW", "PT", "PTH", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "SLOT",
  "T10", "T20", "TID", "UP", "W", "YTT",
]

[lint.per-file-ignores]
"**/test/golden-legacy/main.py" = ["E402", "T201"]
"**/test/golden-legacy/lamac.py" = ["S603"]
"**/test/golden-legacy/lamavm.py" = ["S603"]
"**/test/golden-legacy/test_printbc.py" = ["ANN401"]

[lint.pep8-naming]
ignore-names = ["addSuccess", "addFailure", "addError", "addSkip", "runTest"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
