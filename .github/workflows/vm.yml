name: Lama VM

on:
  push:
    branches: [vm]
  pull_request:
    branches: [vm]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: nix develop --command ./vm/scripts/build.sh

      - name: Test
        run: nix develop --command ./vm/scripts/test.sh
