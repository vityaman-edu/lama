name: Lama VM

on:
  push:
    branches:
      - vm
  pull_request:
    branches:
      - vm
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        mode:
          - release
          - asan
          - fuzz

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download
        run: nix develop --command echo downloading...

      - name: Build
        run: nix develop --command env CXX=clang++ ./vm/scripts/build.sh ${{ matrix.mode }}

      - name: Test
        run: nix develop --command ./vm/scripts/test.sh ${{ matrix.mode }}
