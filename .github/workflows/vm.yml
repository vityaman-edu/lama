name: Lama VM

on:
  push:
    branches:
      - vm
  pull_request:
    branches:
      - vm
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CCACHE_DIR: ${{ github.workspace }}/vm/build/ccache/${{ matrix.mode }}
      CCACHE_MAXSIZE: 1GiB
      CCACHE_COMPILERCHECK: content

    strategy:
      fail-fast: false
      matrix:
        mode:
          - release
          - asan
          - fuzz

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache CCache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.mode }}-${{ hashFiles('flake.lock', 'flake.nix') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.mode }}-${{ hashFiles('flake.lock', 'flake.nix') }}-

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download
        run: nix develop --command echo downloading...

      - name: Reset CCache Statistics
        run: nix develop --command ccache --zero-stats

      - name: Build
        run: nix develop --command env CXX=clang++ ./vm/scripts/build.sh ${{ matrix.mode }}

      - name: Show CCache Statistics
        if: always()
        run: nix develop --command ccache --show-stats

      - name: Test
        run: nix develop --command ./vm/scripts/test.sh ${{ matrix.mode }}
